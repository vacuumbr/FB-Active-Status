<!doctype html>
<html lang="vi" data-theme="light" class="theme-initializing">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FB Active Status</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="w-[380px] m-0 p-0 font-sans antialiased select-none bg-[var(--bg-app)] text-[var(--text-main)] transition-colors duration-200">
    <main class="flex flex-col gap-3.5 p-[20px_22px] min-h-0 animate-[popupFadeIn_0.18s_ease-out]">
      <header class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="grid w-11 h-11 place-items-center rounded-[14px] text-white bg-gradient-to-br from-[var(--brand-logo-from)] to-[var(--brand-logo-to)] shadow-[0_2px_4px_rgba(0,0,0,0.18),inset_0_1px_0_rgba(255,255,255,0.2)] shrink-0" aria-hidden="true">
            <span id="brandIcon" class="flex items-center justify-center [&>svg]:w-6 [&>svg]:h-6 [&>svg]:stroke-current"></span>
          </div>
          <div class="flex flex-col gap-0.5">
            <h1 class="m-0 text-[16.5px] font-semibold leading-tight tracking-tight text-[var(--text-main)]">FB Active Status</h1>
            <p id="brandSubtitle" class="m-0 whitespace-nowrap text-[11.5px] text-[var(--text-muted)] leading-tight">Trạng thái hoạt động</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button
            id="themeButton"
            class="theme-button grid w-10 h-10 place-items-center rounded-xl border border-[var(--header-btn-border)] text-[var(--text-muted)] bg-[var(--header-btn-bg)] hover:bg-[var(--header-btn-hover)] hover:text-[var(--text-main)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--bg-app)] transition-[background-color,border-color,color] duration-150 cursor-pointer"
            type="button"
            aria-label="Giao diện: Theo hệ thống"
            title="Giao diện: Theo hệ thống"
          >
            <span id="themeIcon" class="flex items-center justify-center [&>svg]:w-4 [&>svg]:h-4 [&>svg]:stroke-current" aria-hidden="true"></span>
          </button>
          <div
            id="languageSwitch"
            class="flex items-center p-[3px] rounded-[13px] border border-[var(--header-btn-border)] bg-[var(--header-btn-bg)] gap-0.5"
            role="group"
            aria-label="Ngôn ngữ"
          >
            <button
              id="languageViButton"
              class="language-option is-active min-w-[34px] py-1.5 px-2.5 rounded-[9px] border-0 text-[11px] font-semibold hover:text-[var(--text-main)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-ring)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--bg-app)] transition-[background-color,color,box-shadow] duration-150 cursor-pointer"
              type="button"
              aria-pressed="true"
            >
              VI
            </button>
            <button
              id="languageEnButton"
              class="language-option min-w-[34px] py-1.5 px-2.5 rounded-[9px] border-0 text-[11px] font-semibold hover:text-[var(--text-main)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-ring)] focus-visible:ring-offset-1 focus-visible:ring-offset-[var(--bg-app)] transition-[background-color,color,box-shadow] duration-150 cursor-pointer"
              type="button"
              aria-pressed="false"
            >
              EN
            </button>
          </div>
        </div>
      </header>

      <section id="statusCard" class="status-card relative overflow-hidden flex items-center justify-between p-4 px-[18px] rounded-[18px] border transition-[background-color,border-color,box-shadow] duration-200" data-enabled="false">
        <div class="status-main flex items-center gap-3.5">
          <div class="status-indicator grid w-11 h-11 place-items-center rounded-full shrink-0 transition-colors duration-200">
            <span class="status-dot w-4 h-4 rounded-full transition-[background-color,box-shadow] duration-200" aria-hidden="true"></span>
          </div>
          <div>
            <strong id="statusTitle" class="block text-base font-bold leading-tight transition-colors duration-200">Đang tải…</strong>
            <p id="statusDescription" class="m-0 mt-[3px] text-[13px] font-medium transition-colors duration-200"></p>
          </div>
        </div>
        <div id="statusShield" class="status-shield flex items-center justify-center shrink-0 z-10 [&>svg]:w-8 [&>svg]:h-8 [&>svg]:transition-[stroke] [&>svg]:duration-200" aria-hidden="true"></div>
      </section>

      <section id="settings" class="settings border border-[var(--setting-card-border)] rounded-[18px] [background-color:var(--setting-card-bg)] overflow-hidden shadow-[0_2px_6px_rgba(0,0,0,0.16)] transition-[background-color,border-color] duration-200" aria-label="Cài đặt">
        <label class="setting-row flex items-center justify-between gap-4 p-4 px-[18px] cursor-pointer hover:bg-white/[0.02] transition-colors duration-150">
          <div class="setting-main flex items-center gap-3.5">
            <span id="settingIcon" class="setting-icon grid w-11 h-11 place-items-center rounded-full bg-[var(--setting-icon-bg)] text-[var(--setting-icon-color)] shrink-0 [&>svg]:w-5 [&>svg]:h-5 [&>svg]:stroke-current" aria-hidden="true"></span>
            <div>
              <strong id="realtimeTitle" class="block text-[15px] font-semibold text-[var(--text-main)] leading-tight">Chặn realtime</strong>
              <small id="realtimeHint" class="block mt-[3px] text-xs text-[var(--text-muted)]">Chặn luồng dữ liệu trạng thái của Facebook</small>
            </div>
          </div>
          <span class="switch relative flex-none w-[54px] h-[30px]">
            <input id="realtimeToggle" type="checkbox" class="absolute w-px h-px opacity-0" />
            <span class="slider absolute inset-0 rounded-full bg-[var(--switch-off-bg)] transition-colors duration-200" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <button id="reloadButton" type="button" class="inline-flex items-center justify-center gap-2.5 w-full min-h-[52px] py-3.5 px-5 border-0 rounded-2xl text-white [background:var(--btn-primary-bg)] font-sans text-[15.5px] font-semibold cursor-pointer shadow-[var(--btn-primary-shadow),inset_0_1px_1px_rgba(255,255,255,0.4)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--brand-ring)] focus-visible:ring-offset-2 focus-visible:ring-offset-[var(--bg-app)] disabled:cursor-wait disabled:opacity-65 transition-[box-shadow,opacity] duration-150" aria-describedby="feedback">
        <span id="reloadIcon" class="button-icon flex items-center justify-center [&>svg]:w-[18px] [&>svg]:h-[18px] [&>svg]:stroke-white [&>svg]:stroke-[2.2]" aria-hidden="true"></span>
        <span id="reloadText">Tải lại Facebook</span>
      </button>

      <p id="feedback" class="feedback self-center max-h-0 overflow-hidden m-0 inline-flex items-center gap-1.5 rounded-full text-xs font-semibold leading-none opacity-0 -translate-y-0.5 transition-[max-height,padding,opacity,transform,color] duration-150" role="status" aria-live="polite">
        <span id="feedbackIcon" class="feedback-icon inline-flex items-center justify-center shrink-0 [&>svg]:w-[13px] [&>svg]:h-[13px] [&>svg]:stroke-current" aria-hidden="true"></span>
        <span id="feedbackText"></span>
      </p>

      <p id="note" class="note flex items-center justify-center gap-1.5 m-0 pt-3.5 border-t border-[var(--card-border)] text-[11.5px] text-[var(--text-muted)] text-center">
        <span id="noteIcon" class="note-icon inline-flex items-center justify-center opacity-85 [&>svg]:w-[13px] [&>svg]:h-[13px] [&>svg]:stroke-current" aria-hidden="true"></span>
        <span id="noteText">Chặn kết nối realtime của Facebook</span>
      </p>
    </main>

    <script src="lucide.min.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
